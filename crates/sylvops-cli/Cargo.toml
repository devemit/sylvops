[package]
name = "sylvops-cli"
description = "Command-line entry point for SylvOps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "sylvops"
path = "src/main.rs"

[dependencies]
clap.workspace = true
sylvops-core = { path = "../sylvops-core" }
sylvops-daemon = { path = "../sylvops-daemon" }
sylvops-desktop = { path = "../sylvops-desktop" }
sylvops-tui = { path = "../sylvops-tui" }
crossterm.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
vt100.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[lints]
workspace = true
