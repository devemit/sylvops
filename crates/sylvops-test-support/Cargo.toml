[package]
name = "sylvops-test-support"
description = "Deterministic local fixtures for SylvOps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "fake-agent"
path = "src/bin/fake-agent.rs"

[[bin]]
name = "fake-codex"
path = "src/bin/fake-codex.rs"

[[bin]]
name = "hook-daemon"
path = "src/bin/hook-daemon.rs"

[[bin]]
name = "fake-claude"
path = "src/bin/fake-claude.rs"

[[bin]]
name = "fake-gh"
path = "src/bin/fake-gh.rs"

[[bin]]
name = "release-manifest"
path = "src/bin/release-manifest.rs"

[dependencies]
base64.workspace = true
ed25519-dalek.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sylvops-core = { path = "../sylvops-core" }
sylvops-daemon = { path = "../sylvops-daemon" }
tempfile = "3"
tokio.workspace = true
toml.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal"] }

[dev-dependencies]
vt100.workspace = true
async-trait.workspace = true
rusqlite.workspace = true
uuid.workspace = true

[lints]
workspace = true
