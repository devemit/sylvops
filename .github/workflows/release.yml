name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  validate-release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify release sources and tag
        shell: pwsh
        run: ./scripts/validate-release.ps1 -ExpectedTag "$env:GITHUB_REF_NAME"

  package-windows:
    needs: validate-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release --locked -p sylvops-cli
      - name: Verify application version
        shell: pwsh
        run: |
          $expected = "sylvops $($env:GITHUB_REF_NAME.Substring(1))"
          $actual = (& target/release/sylvops.exe --version).Trim()
          if ($actual -ne $expected) { throw "Application version '$actual' does not match release tag '$env:GITHUB_REF_NAME'." }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item target/release/sylvops.exe package/
          Copy-Item README.md,LICENSE package/
          Copy-Item packaging/windows/Start-SylvOps.ps1 package/
          Copy-Item "packaging/windows/Start SylvOps.cmd" package/
          Copy-Item packaging/windows/QUICKSTART.txt package/
          Compress-Archive package/* sylvops-windows-x86_64.zip
      - name: Validate package contents
        shell: pwsh
        run: ./scripts/validate-release.ps1 -ArchivePath sylvops-windows-x86_64.zip -ExpectedTag "$env:GITHUB_REF_NAME"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: sylvops-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: sylvops-windows-x86_64.zip

  package-unix:
    needs: validate-release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: sylvops-linux-x86_64.tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: sylvops-macos-x86_64.tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            asset: sylvops-macos-aarch64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked -p sylvops-cli --target "${{ matrix.target }}"
      - name: Verify application version
        run: |
          expected="sylvops ${GITHUB_REF_NAME#v}"
          actual="$(target/${{ matrix.target }}/release/sylvops --version)"
          test "$actual" = "$expected"
      - name: Package
        run: |
          test -x "target/${{ matrix.target }}/release/sylvops"
          mkdir package
          cp "target/${{ matrix.target }}/release/sylvops" README.md LICENSE package/
          tar -C package -czf "${{ matrix.asset }}" sylvops README.md LICENSE
      - name: Validate package contents
        shell: pwsh
        run: ./scripts/validate-release.ps1 -ArchivePath "${{ matrix.asset }}" -ExpectedTag "$env:GITHUB_REF_NAME"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: ${{ matrix.asset }}

  stage-release:
    needs: [package-windows, package-unix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: "*package*"
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum sylvops-* > SHA256SUMS
      - name: Validate staged release bundle
        shell: pwsh
        run: ./scripts/validate-release.ps1 -DistDirectory dist -ExpectedTag "$env:GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: stage-release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: release-bundle-${{ github.sha }}
          path: dist
      - name: Revalidate approved release bundle
        shell: pwsh
        run: ./scripts/validate-release.ps1 -DistDirectory dist -ExpectedTag "$env:GITHUB_REF_NAME"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
