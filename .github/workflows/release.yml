name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  validate-release:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    env:
      SYLVOPS_UPDATE_PUBLIC_KEY_BASE64: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify release sources and tag
        shell: pwsh
        run: ./scripts/validate-release.ps1 -ExpectedTag "$env:GITHUB_REF_NAME"

  package-windows:
    needs: validate-release
    runs-on: windows-latest
    environment: release
    env:
      SYLVOPS_UPDATE_PUBLIC_KEY_BASE64: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY_BASE64 }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Resolve previous Windows release
        id: previous-windows
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $previousJson = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=1"
          if ($LASTEXITCODE -ne 0) { throw 'Could not determine the previous GitHub release.' }
          $releases = @($previousJson | ConvertFrom-Json)
          $previous = if ($releases.Count -gt 0) { $releases[0] } else { $null }
          if ($null -eq $previous -or $previous.tag_name -eq $env:GITHUB_REF_NAME) {
            'installer=' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            'coverage=not_applicable_initial_release' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          else {
            New-Item -ItemType Directory -Path previous | Out-Null
            gh release download $previous.tag_name --repo $env:GITHUB_REPOSITORY --pattern 'sylvops-windows-x86_64-setup.exe' --dir previous
            "installer=$env:GITHUB_WORKSPACE\previous\sylvops-windows-x86_64-setup.exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            'coverage=passed' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned cargo-packager
        shell: pwsh
        run: |
          $packagerVersion = (Get-Content -Raw packaging/cargo-packager.version).Trim()
          cargo install cargo-packager --version $packagerVersion --locked
      - name: Build release binary
        env:
          SYLVOPS_UPDATE_PUBLIC_KEY_BASE64: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY_BASE64 }}
        run: cargo build --release --locked -p sylvops-cli
      - name: Import protected Windows signing identity
        id: windows-signing
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)) { throw 'WINDOWS_SIGNING_CERTIFICATE_BASE64 is not configured.' }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)) { throw 'WINDOWS_SIGNING_CERTIFICATE_PASSWORD is not configured.' }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_TIMESTAMP_URL)) { throw 'WINDOWS_SIGNING_TIMESTAMP_URL is not configured.' }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'sylvops-windows-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
            $password = ConvertTo-SecureString $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation 'Cert:\CurrentUser\My' -Password $password
            if ($null -eq $certificate -or -not $certificate.HasPrivateKey) { throw 'The Windows signing certificate could not be imported with its private key.' }
            "thumbprint=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "timestamp_url=$env:WINDOWS_SIGNING_TIMESTAMP_URL" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          finally {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }
      - name: Sign release executable
        shell: pwsh
        run: ./scripts/sign-windows.ps1 -Path target/release/sylvops.exe -CertificateThumbprint '${{ steps.windows-signing.outputs.thumbprint }}' -TimestampUrl '${{ steps.windows-signing.outputs.timestamp_url }}' -RequireTrustedSignature
      - name: Verify application version
        shell: pwsh
        run: |
          $expected = "sylvops $($env:GITHUB_REF_NAME.Substring(1))"
          $actual = (& target/release/sylvops.exe --version).Trim()
          if ($actual -ne $expected) { throw "Application version '$actual' does not match release tag '$env:GITHUB_REF_NAME'." }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item target/release/sylvops.exe package/
          Copy-Item README.md,LICENSE package/
          Copy-Item packaging/windows/Start-SylvOps.ps1 package/
          Copy-Item "packaging/windows/Start SylvOps.cmd" package/
          Copy-Item packaging/windows/QUICKSTART.txt package/
          Compress-Archive package/* sylvops-windows-x86_64.zip
      - name: Build signed per-user installer
        shell: pwsh
        run: ./scripts/package-windows-installer.ps1 -CertificateThumbprint '${{ steps.windows-signing.outputs.thumbprint }}' -TimestampUrl '${{ steps.windows-signing.outputs.timestamp_url }}' -RequireTrustedSignature -SkipBuild
      - name: Generate Windows native-upgrade test manifests
        if: steps.previous-windows.outputs.installer != ''
        shell: pwsh
        env:
          UPDATE_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_BASE64 }}
          UPDATE_SIGNING_PUBLIC_KEY_BASE64: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_SIGNING_PRIVATE_KEY_BASE64)) { throw 'UPDATE_SIGNING_PRIVATE_KEY_BASE64 is not configured.' }
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_SIGNING_PUBLIC_KEY_BASE64)) { throw 'UPDATE_SIGNING_PUBLIC_KEY_BASE64 is not configured.' }
          $keyPath = Join-Path $env:RUNNER_TEMP 'sylvops-update-signing-key'
          try {
            [IO.File]::WriteAllText($keyPath, $env:UPDATE_SIGNING_PRIVATE_KEY_BASE64)
            $version = $env:GITHUB_REF_NAME.Substring(1)
            $semanticVersion = [version]$version
            $failedVersion = "$($semanticVersion.Major).$($semanticVersion.Minor).$($semanticVersion.Build + 1)"
            $publishedAt = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
            $asset = 'dist/sylvops-windows-x86_64-setup.exe'
            $notesUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:GITHUB_REF_NAME"
            $assetUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/sylvops-windows-x86_64-setup.exe"
            cargo run --locked -p sylvops-test-support --bin release-manifest -- generate $asset windows-upgrade-success.json $assetUrl $notesUrl 0.1.0 $version windows x86_64 windows_nsis $keyPath $publishedAt 'Windows native upgrade success probe.'
            if ($LASTEXITCODE -ne 0) { throw 'Could not generate the Windows native-upgrade success manifest.' }
            cargo run --locked -p sylvops-test-support --bin release-manifest -- generate $asset windows-upgrade-failed-health.json $assetUrl $notesUrl 0.1.0 $failedVersion windows x86_64 windows_nsis $keyPath $publishedAt 'Windows native upgrade failed-health probe.'
            if ($LASTEXITCODE -ne 0) { throw 'Could not generate the Windows failed-health manifest.' }
            cargo run --locked -p sylvops-test-support --bin release-manifest -- verify windows-upgrade-success.json $asset $env:UPDATE_SIGNING_PUBLIC_KEY_BASE64
            if ($LASTEXITCODE -ne 0) { throw 'The Windows native-upgrade success manifest did not verify.' }
            cargo run --locked -p sylvops-test-support --bin release-manifest -- verify windows-upgrade-failed-health.json $asset $env:UPDATE_SIGNING_PUBLIC_KEY_BASE64
            if ($LASTEXITCODE -ne 0) { throw 'The Windows failed-health manifest did not verify.' }
          }
          finally {
            Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue
          }
      - name: Install, launch, verify, and uninstall
        shell: pwsh
        run: |
          $previous = @()
          if (-not [string]::IsNullOrWhiteSpace('${{ steps.previous-windows.outputs.installer }}')) {
            $previous = @('-PreviousInstallerPath', '${{ steps.previous-windows.outputs.installer }}')
          }
          ./scripts/test-windows-installer.ps1 -InstallerPath dist/sylvops-windows-x86_64-setup.exe -CertificateThumbprint '${{ steps.windows-signing.outputs.thumbprint }}' -RequireTrustedSignature -RequireTimestamp @previous
      - name: Exercise native N-1 upgrade and rollback
        if: steps.previous-windows.outputs.installer != ''
        shell: pwsh
        run: |
          ./scripts/test-windows-native-upgrade.ps1 `
            -CandidateInstallerPath dist/sylvops-windows-x86_64-setup.exe `
            -CandidateExecutablePath target/release/sylvops.exe `
            -PreviousInstallerPath '${{ steps.previous-windows.outputs.installer }}' `
            -SuccessManifestPath windows-upgrade-success.json `
            -FailedHealthManifestPath windows-upgrade-failed-health.json
      - name: Record Windows native package evidence
        shell: pwsh
        run: |
          @{ target = 'windows_x86_64'; native_package_upgrade_and_rollback = '${{ steps.previous-windows.outputs.coverage }}' } | ConvertTo-Json -Compress | Set-Content native-package-evidence-windows-x86_64.json
      - name: Validate package contents
        shell: pwsh
        run: ./scripts/validate-release.ps1 -ArchivePath sylvops-windows-x86_64.zip -InstallerPath dist/sylvops-windows-x86_64-setup.exe -ExpectedTag "$env:GITHUB_REF_NAME"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            sylvops-windows-x86_64.zip
            dist/sylvops-windows-x86_64-setup.exe
            native-package-evidence-windows-x86_64.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            sylvops-windows-x86_64.zip
            dist/sylvops-windows-x86_64-setup.exe
            native-package-evidence-windows-x86_64.json
      - name: Remove protected Windows signing identity
        if: always()
        shell: pwsh
        run: |
          $thumbprint = '${{ steps.windows-signing.outputs.thumbprint }}'
          if (-not [string]::IsNullOrWhiteSpace($thumbprint)) {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint" -Force -ErrorAction SilentlyContinue
          }

  package-linux:
    needs: validate-release
    runs-on: ubuntu-latest
    environment: release
    env:
      SYLVOPS_UPDATE_PUBLIC_KEY_BASE64: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY_BASE64 }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Resolve previous Linux release
        id: previous-linux
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=1" --jq '.[0].tag_name // ""')"
          [[ "$previous_tag" != "$GITHUB_REF_NAME" ]] || previous_tag=""
          if [[ -z "$previous_tag" ]]; then
            echo 'appimage=' >> "$GITHUB_OUTPUT"
            echo 'deb=' >> "$GITHUB_OUTPUT"
            echo 'coverage=not_applicable_initial_release' >> "$GITHUB_OUTPUT"
          else
            mkdir previous
            gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" --pattern 'sylvops-linux-x86_64.AppImage' --pattern 'sylvops-linux-x86_64.deb' --dir previous
            chmod +x previous/sylvops-linux-x86_64.AppImage
            echo "appimage=$GITHUB_WORKSPACE/previous/sylvops-linux-x86_64.AppImage" >> "$GITHUB_OUTPUT"
            echo "deb=$GITHUB_WORKSPACE/previous/sylvops-linux-x86_64.deb" >> "$GITHUB_OUTPUT"
            echo 'coverage=passed' >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Install Linux packaging prerequisites
        run: |
          timeout --signal=TERM --kill-after=5 300 sudo --non-interactive apt-get update
          timeout --signal=TERM --kill-after=5 300 sudo --non-interactive env DEBIAN_FRONTEND=noninteractive apt-get install --yes patchelf
      - name: Install pinned cargo-packager
        run: |
          packager_version="$(cat packaging/cargo-packager.version)"
          cargo install cargo-packager --version "$packager_version" --locked
      - name: Build release binary
        env:
          SYLVOPS_UPDATE_PUBLIC_KEY_BASE64: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY_BASE64 }}
        run: cargo build --release --locked -p sylvops-cli --target x86_64-unknown-linux-gnu
      - name: Verify application version
        run: |
          expected="sylvops ${GITHUB_REF_NAME#v}"
          actual="$(target/x86_64-unknown-linux-gnu/release/sylvops --version)"
          test "$actual" = "$expected"
      - name: Package portable fallback
        run: |
          test -x "target/x86_64-unknown-linux-gnu/release/sylvops"
          mkdir package
          cp target/x86_64-unknown-linux-gnu/release/sylvops README.md LICENSE package/
          tar -C package -czf sylvops-linux-x86_64.tar.gz sylvops README.md LICENSE
      - name: Build AppImage and deb application packages
        env:
          SYLVOPS_UPDATE_PUBLIC_KEY_BASE64: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY_BASE64 }}
        run: ./scripts/package-linux.sh --skip-build
      - name: Verify Debian dependency closure
        run: |
          timeout --signal=TERM --kill-after=5 300 sudo --non-interactive env DEBIAN_FRONTEND=noninteractive apt-get install --yes "$(realpath dist/sylvops-linux-x86_64.deb)"
          timeout --signal=TERM --kill-after=5 30 ldd /usr/bin/sylvops | tee /tmp/sylvops-ldd.txt
          ! grep -Fq 'not found' /tmp/sylvops-ldd.txt
          test "$(sylvops --version)" = "sylvops ${GITHUB_REF_NAME#v}"
          timeout --signal=TERM --kill-after=5 120 sudo --non-interactive dpkg --remove sylvops
      - name: Install desktop smoke test dependencies
        run: timeout --signal=TERM --kill-after=5 300 sudo --non-interactive env DEBIAN_FRONTEND=noninteractive apt-get install --yes xvfb x11-utils libgtk-3-bin desktop-file-utils libfuse2 libxdo3
      - name: Install, launch, verify, and remove
        run: |
          previous=()
          if [[ -n '${{ steps.previous-linux.outputs.appimage }}' ]]; then
            previous+=(--previous-appimage '${{ steps.previous-linux.outputs.appimage }}' --previous-deb '${{ steps.previous-linux.outputs.deb }}')
          fi
          ./scripts/test-linux-packages.sh --appimage dist/sylvops-linux-x86_64.AppImage --deb dist/sylvops-linux-x86_64.deb --expected-version "${GITHUB_REF_NAME#v}" "${previous[@]}"
      - name: Record Linux native package evidence
        run: jq -n --arg status '${{ steps.previous-linux.outputs.coverage }}' '{target: "linux_x86_64", native_package_upgrade_and_rollback: $status}' > native-package-evidence-linux-x86_64.json
      - name: Validate package contents
        shell: pwsh
        run: ./scripts/validate-release.ps1 -ArchivePath sylvops-linux-x86_64.tar.gz -LinuxPackagePath dist/sylvops-linux-x86_64.AppImage,dist/sylvops-linux-x86_64.deb -ExpectedTag "$env:GITHUB_REF_NAME"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            sylvops-linux-x86_64.tar.gz
            dist/sylvops-linux-x86_64.AppImage
            dist/sylvops-linux-x86_64.deb
            native-package-evidence-linux-x86_64.json
      - uses: actions/upload-artifact@v4
        with:
          name: package-x86_64-unknown-linux-gnu
          path: |
            sylvops-linux-x86_64.tar.gz
            dist/sylvops-linux-x86_64.AppImage
            dist/sylvops-linux-x86_64.deb
            native-package-evidence-linux-x86_64.json

  package-macos:
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            architecture: x86_64
            archive: sylvops-macos-x86_64.tar.gz
            dmg: sylvops-macos-x86_64.dmg
          - os: macos-15
            target: aarch64-apple-darwin
            architecture: aarch64
            archive: sylvops-macos-aarch64.tar.gz
            dmg: sylvops-macos-aarch64.dmg
    runs-on: ${{ matrix.os }}
    environment: release
    env:
      SYLVOPS_UPDATE_PUBLIC_KEY_BASE64: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY_BASE64 }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Resolve previous macOS release
        id: previous-macos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=1" --jq '.[0].tag_name // ""')"
          [[ "$previous_tag" != "$GITHUB_REF_NAME" ]] || previous_tag=""
          if [[ -z "$previous_tag" ]]; then
            echo 'dmg=' >> "$GITHUB_OUTPUT"
            echo 'coverage=not_applicable_initial_release' >> "$GITHUB_OUTPUT"
          else
            mkdir previous
            gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" --pattern '${{ matrix.dmg }}' --dir previous
            echo "dmg=$GITHUB_WORKSPACE/previous/${{ matrix.dmg }}" >> "$GITHUB_OUTPUT"
            echo 'coverage=passed' >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install pinned cargo-packager
        shell: pwsh
        run: |
          $packagerVersion = (Get-Content -Raw packaging/cargo-packager.version).Trim()
          cargo install cargo-packager --version $packagerVersion --locked
      - name: Import protected Developer ID identity
        id: macos-signing
        env:
          MACOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: |
          test -n "$MACOS_SIGNING_CERTIFICATE_BASE64"
          test -n "$MACOS_SIGNING_CERTIFICATE_PASSWORD"
          test -n "$MACOS_SIGNING_IDENTITY"
          case "$MACOS_SIGNING_IDENTITY" in
            "Developer ID Application:"*) ;;
            *) echo "MACOS_SIGNING_IDENTITY must name a Developer ID Application certificate." >&2; exit 1 ;;
          esac
          certificate_path="$RUNNER_TEMP/sylvops-developer-id.p12"
          keychain_path="$RUNNER_TEMP/sylvops-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$MACOS_SIGNING_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$MACOS_SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" > "$RUNNER_TEMP/sylvops-signing-identities.txt"
          grep -Fq "$MACOS_SIGNING_IDENTITY" "$RUNNER_TEMP/sylvops-signing-identities.txt"
          rm -f "$certificate_path" "$RUNNER_TEMP/sylvops-signing-identities.txt"
          echo "keychain_path=$keychain_path" >> "$GITHUB_OUTPUT"
      - name: Prepare protected notarization key
        id: macos-notary
        env:
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ vars.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ vars.MACOS_NOTARY_ISSUER_ID }}
        run: |
          test -n "$MACOS_NOTARY_KEY_BASE64"
          test -n "$MACOS_NOTARY_KEY_ID"
          test -n "$MACOS_NOTARY_ISSUER_ID"
          [[ "$MACOS_NOTARY_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "MACOS_NOTARY_KEY_ID must be a 10-character Apple API key ID." >&2; exit 1; }
          notary_key_path="$RUNNER_TEMP/AuthKey_${MACOS_NOTARY_KEY_ID}.p8"
          printf '%s' "$MACOS_NOTARY_KEY_BASE64" | base64 -D > "$notary_key_path"
          chmod 600 "$notary_key_path"
          echo "key_path=$notary_key_path" >> "$GITHUB_OUTPUT"
      - name: Build signed and notarized application package
        env:
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_KEY_ID: ${{ vars.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ vars.MACOS_NOTARY_ISSUER_ID }}
          SYLVOPS_UPDATE_PUBLIC_KEY_BASE64: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY_BASE64 }}
        run: |
          ./scripts/package-macos.sh \
            --target '${{ matrix.target }}' \
            --architecture '${{ matrix.architecture }}' \
            --signing-identity "$MACOS_SIGNING_IDENTITY" \
            --keychain '${{ steps.macos-signing.outputs.keychain_path }}' \
            --notary-key '${{ steps.macos-notary.outputs.key_path }}' \
            --notary-key-id "$MACOS_NOTARY_KEY_ID" \
            --notary-issuer-id "$MACOS_NOTARY_ISSUER_ID" \
            --require-developer-id
      - name: Generate macOS native-upgrade test manifests
        if: steps.previous-macos.outputs.dmg != ''
        env:
          UPDATE_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_BASE64 }}
          UPDATE_SIGNING_PUBLIC_KEY_BASE64: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY_BASE64 }}
        run: |
          test -n "$UPDATE_SIGNING_PRIVATE_KEY_BASE64"
          test -n "$UPDATE_SIGNING_PUBLIC_KEY_BASE64"
          key_path="$RUNNER_TEMP/sylvops-update-signing-key"
          trap 'rm -f "$key_path"' EXIT
          printf '%s' "$UPDATE_SIGNING_PRIVATE_KEY_BASE64" > "$key_path"
          chmod 600 "$key_path"
          version="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$version"
          failed_version="$major.$minor.$((patch + 1))"
          published_at="$(date +%s)"
          asset='dist/${{ matrix.dmg }}'
          asset_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${{ matrix.dmg }}"
          notes_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          invalid_asset='macos-upgrade-invalid-trust.dmg'
          cp "$asset" "$invalid_asset"
          codesign --remove-signature "$invalid_asset"
          codesign --force --sign - "$invalid_asset"
          generate_manifest() {
            local package="$1" manifest="$2" target_version="$3" notes="$4"
            cargo run --locked -p sylvops-test-support --bin release-manifest -- generate \
              "$package" "$manifest" "$asset_url" "$notes_url" 0.1.0 "$target_version" \
              macos '${{ matrix.architecture }}' macos_dmg "$key_path" "$published_at" "$notes"
            cargo run --locked -p sylvops-test-support --bin release-manifest -- verify \
              "$manifest" "$package" "$UPDATE_SIGNING_PUBLIC_KEY_BASE64"
          }
          generate_manifest "$asset" macos-upgrade-success.json "$version" 'macOS native upgrade success probe.'
          generate_manifest "$invalid_asset" macos-upgrade-invalid-trust.json "$version" 'macOS invalid signature and notarization probe.'
          generate_manifest "$asset" macos-upgrade-failed-health.json "$failed_version" 'macOS native upgrade failed-health probe.'
          rm -f "$key_path"
          trap - EXIT
      - name: Verify application version
        run: |
          expected="sylvops ${GITHUB_REF_NAME#v}"
          actual="$(target/${{ matrix.target }}/release/sylvops --version)"
          test "$actual" = "$expected"
      - name: Package portable fallback
        run: |
          test -x "target/${{ matrix.target }}/release/sylvops"
          mkdir package
          cp "target/${{ matrix.target }}/release/sylvops" README.md LICENSE package/
          tar -C package -czf '${{ matrix.archive }}' sylvops README.md LICENSE
      - name: Install, launch, verify, and remove
        run: |
          previous=()
          if [[ -n '${{ steps.previous-macos.outputs.dmg }}' ]]; then
            previous+=(--previous-dmg '${{ steps.previous-macos.outputs.dmg }}')
          fi
          ./scripts/test-macos-package.sh \
            --dmg 'dist/${{ matrix.dmg }}' \
            --architecture '${{ matrix.architecture }}' \
            --expected-version "${GITHUB_REF_NAME#v}" \
            "${previous[@]}" \
            --require-developer-id \
            --require-notarization
      - name: Exercise native N-1 upgrade and rollback
        if: steps.previous-macos.outputs.dmg != ''
        run: |
          ./scripts/test-macos-native-upgrade.sh \
            --candidate-dmg 'dist/${{ matrix.dmg }}' \
            --invalid-trust-dmg macos-upgrade-invalid-trust.dmg \
            --previous-dmg '${{ steps.previous-macos.outputs.dmg }}' \
            --success-manifest macos-upgrade-success.json \
            --invalid-trust-manifest macos-upgrade-invalid-trust.json \
            --failed-health-manifest macos-upgrade-failed-health.json
      - name: Record macOS native package evidence
        run: jq -n --arg target 'macos_${{ matrix.architecture }}' --arg status '${{ steps.previous-macos.outputs.coverage }}' '{target: $target, native_package_upgrade_and_rollback: $status}' > 'native-package-evidence-macos-${{ matrix.architecture }}.json'
      - name: Validate package contents
        shell: pwsh
        run: ./scripts/validate-release.ps1 -ArchivePath '${{ matrix.archive }}' -MacosPackagePath 'dist/${{ matrix.dmg }}' -ExpectedTag "$env:GITHUB_REF_NAME"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ matrix.archive }}
            dist/${{ matrix.dmg }}
            native-package-evidence-macos-${{ matrix.architecture }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: |
            ${{ matrix.archive }}
            dist/${{ matrix.dmg }}
            native-package-evidence-macos-${{ matrix.architecture }}.json
      - name: Remove protected macOS credentials
        if: always()
        env:
          MACOS_NOTARY_KEY_ID: ${{ vars.MACOS_NOTARY_KEY_ID }}
        run: |
          keychain_path="$RUNNER_TEMP/sylvops-signing.keychain-db"
          security delete-keychain "$keychain_path" 2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/sylvops-developer-id.p12" \
            "$RUNNER_TEMP/sylvops-signing-identities.txt"
          if [[ "$MACOS_NOTARY_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            rm -f "$RUNNER_TEMP/AuthKey_${MACOS_NOTARY_KEY_ID}.p8"
          fi

  stage-release:
    needs: [package-windows, package-linux, package-macos]
    runs-on: ubuntu-latest
    environment: release
    env:
      SYLVOPS_UPDATE_PUBLIC_KEY_BASE64: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: "*package*"
          merge-multiple: true
      - name: Restore AppImage executable permission
        run: chmod 755 dist/sylvops-linux-x86_64.AppImage
      - name: Generate and verify signed update metadata
        env:
          UPDATE_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_BASE64 }}
          UPDATE_SIGNING_PUBLIC_KEY_BASE64: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY_BASE64 }}
        run: |
          test -n "$UPDATE_SIGNING_PRIVATE_KEY_BASE64"
          test -n "$UPDATE_SIGNING_PUBLIC_KEY_BASE64"
          key_file="$RUNNER_TEMP/sylvops-update-signing-key"
          printf '%s' "$UPDATE_SIGNING_PRIVATE_KEY_BASE64" > "$key_file"
          chmod 600 "$key_file"
          published_at="$(date +%s)"
          version="${GITHUB_REF_NAME#v}"
          notes_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          notes="See the signed SylvOps ${version} release notes before installing."
          generate_manifest() {
            local asset="$1" manifest="$2" platform="$3" architecture="$4" installer="$5"
            cargo run --locked -p sylvops-test-support --bin release-manifest -- generate \
              "dist/$asset" "dist/$manifest" \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$asset" \
              "$notes_url" "0.1.0" "$version" "$platform" "$architecture" "$installer" \
              "$key_file" "$published_at" "$notes"
            cargo run --locked -p sylvops-test-support --bin release-manifest -- verify \
              "dist/$manifest" "dist/$asset" "$UPDATE_SIGNING_PUBLIC_KEY_BASE64"
          }
          generate_manifest sylvops-windows-x86_64-setup.exe sylvops-update-windows-x86_64-nsis.json windows x86_64 windows_nsis
          generate_manifest sylvops-macos-x86_64.dmg sylvops-update-macos-x86_64-dmg.json macos x86_64 macos_dmg
          generate_manifest sylvops-macos-aarch64.dmg sylvops-update-macos-aarch64-dmg.json macos aarch64 macos_dmg
          generate_manifest sylvops-linux-x86_64.AppImage sylvops-update-linux-x86_64-appimage.json linux x86_64 linux_app_image
          generate_manifest sylvops-linux-x86_64.deb sylvops-update-linux-x86_64-deb.json linux x86_64 linux_deb
          rm -f "$key_file"
      - name: Record cross-platform promotion evidence
        run: |
          version="${GITHUB_REF_NAME#v}"
          evidence=(dist/native-package-evidence-*.json)
          [[ "${#evidence[@]}" -eq 4 ]]
          passed_count="$(jq -r 'select(.native_package_upgrade_and_rollback == "passed") | .target' "${evidence[@]}" | wc -l)"
          initial_count="$(jq -r 'select(.native_package_upgrade_and_rollback == "not_applicable_initial_release") | .target' "${evidence[@]}" | wc -l)"
          if [[ "$passed_count" -eq 4 ]]; then
            native_package_upgrade="passed"
          elif [[ "$initial_count" -eq 4 && "$version" == "0.1.0" ]]; then
            native_package_upgrade="not_applicable_initial_release"
          else
            echo "Native package upgrade evidence is incomplete or inconsistent." >&2
            exit 1
          fi
          jq -n \
            --arg version "$version" \
            --arg commit "$GITHUB_SHA" \
            --arg native_package_upgrade "$native_package_upgrade" \
            '{schema_version: 1, version: $version, commit: $commit, native_package_jobs: {windows_x86_64: "passed", linux_x86_64: "passed", macos_x86_64: "passed", macos_aarch64: "passed"}, upgrade_contract: {signed_metadata: "verified", staged_payloads: "verified", native_package_upgrade_and_rollback: $native_package_upgrade, coordinator_rollback_unit: "passed", detached_helper_rollback_integration: "passed"}}' \
            > dist/RELEASE-EVIDENCE.json
          rm -f "${evidence[@]}"
      - name: Create checksums
        working-directory: dist
        run: sha256sum RELEASE-EVIDENCE.json sylvops-* > SHA256SUMS
      - name: Validate staged release bundle
        shell: pwsh
        run: ./scripts/validate-release.ps1 -DistDirectory dist -ExpectedTag "$env:GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/SHA256SUMS
            dist/RELEASE-EVIDENCE.json
            dist/sylvops-update-*.json

  publish:
    needs: stage-release
    runs-on: ubuntu-latest
    environment: release
    env:
      SYLVOPS_UPDATE_PUBLIC_KEY_BASE64: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: release-bundle-${{ github.sha }}
          path: dist
      - name: Restore AppImage executable permission
        run: chmod 755 dist/sylvops-linux-x86_64.AppImage
      - name: Revalidate approved release bundle
        shell: pwsh
        run: ./scripts/validate-release.ps1 -DistDirectory dist -ExpectedTag "$env:GITHUB_REF_NAME"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
