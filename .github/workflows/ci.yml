name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test core library
        run: cargo test -p sylvops-core --lib
      - name: Test daemon library
        run: cargo test -p sylvops-daemon --lib
      - name: Test TUI library
        run: cargo test -p sylvops-tui --lib
      - name: Test CLI binary
        run: cargo test -p sylvops-cli --bins
      - name: Test support targets
        run: cargo test -p sylvops-test-support --lib --bins
      - name: Test daemon lifecycle
        run: cargo test -p sylvops-daemon --test daemon_lifecycle
      - name: Test local transport
        run: cargo test -p sylvops-daemon --test local_transport
      - name: Test persistent sessions
        run: cargo test -p sylvops-daemon --test persistent_sessions
      - name: Test managed worktrees
        run: cargo test -p sylvops-daemon --test worktree_sessions
      - name: Test Codex MVP
        run: cargo test -p sylvops-test-support --test codex_mvp
      - name: Test PTY sessions
        run: cargo test -p sylvops-test-support --test pty_session
