name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Validate release-proof sources
        shell: pwsh
        run: ./scripts/validate-release.ps1
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run workspace tests
        run: cargo test --workspace --all-targets

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned cargo-packager
        shell: pwsh
        run: |
          $packagerVersion = (Get-Content -Raw packaging/cargo-packager.version).Trim()
          cargo install cargo-packager --version $packagerVersion --locked
      - name: Create isolated test signing identity
        id: test-signing
        shell: pwsh
        run: |
          $certificate = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject 'CN=SylvOps CI Installer Test' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -NotAfter (Get-Date).AddDays(1)
          "thumbprint=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Build test-signed installer
        shell: pwsh
        run: ./scripts/package-windows-installer.ps1 -CertificateThumbprint '${{ steps.test-signing.outputs.thumbprint }}'
      - name: Install, launch, verify, and uninstall
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1 -InstallerPath dist/sylvops-windows-x86_64-setup.exe -CertificateThumbprint '${{ steps.test-signing.outputs.thumbprint }}'
      - name: Remove isolated test signing identity
        if: always()
        shell: pwsh
        run: |
          $thumbprint = '${{ steps.test-signing.outputs.thumbprint }}'
          if (-not [string]::IsNullOrWhiteSpace($thumbprint)) {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint" -Force -ErrorAction SilentlyContinue
          }

  linux-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Install Linux packaging prerequisites
        run: |
          timeout --signal=TERM --kill-after=5 300 sudo --non-interactive apt-get update
          timeout --signal=TERM --kill-after=5 300 sudo --non-interactive env DEBIAN_FRONTEND=noninteractive apt-get install --yes patchelf
      - name: Install pinned cargo-packager
        run: |
          packager_version="$(cat packaging/cargo-packager.version)"
          cargo install cargo-packager --version "$packager_version" --locked
      - name: Build AppImage and deb packages
        run: ./scripts/package-linux.sh
      - name: Verify Debian dependency closure
        run: |
          timeout --signal=TERM --kill-after=5 300 sudo --non-interactive env DEBIAN_FRONTEND=noninteractive apt-get install --yes "$(realpath dist/sylvops-linux-x86_64.deb)"
          timeout --signal=TERM --kill-after=5 30 ldd /usr/bin/sylvops | tee /tmp/sylvops-ldd.txt
          ! grep -Fq 'not found' /tmp/sylvops-ldd.txt
          test "$(sylvops --version)" = "sylvops $(awk '/^\[workspace.package\]/{workspace_package=1; next} workspace_package && /^version = /{gsub(/"/, "", $3); print $3; exit}' Cargo.toml)"
          timeout --signal=TERM --kill-after=5 120 sudo --non-interactive dpkg --remove sylvops
      - name: Install desktop smoke test dependencies
        run: timeout --signal=TERM --kill-after=5 300 sudo --non-interactive env DEBIAN_FRONTEND=noninteractive apt-get install --yes xvfb x11-utils libgtk-3-bin desktop-file-utils
      - name: Install, launch, verify, and remove
        run: |
          expected_version="$(awk '/^\[workspace.package\]/{workspace_package=1; next} workspace_package && /^version = /{gsub(/"/, "", $3); print $3; exit}' Cargo.toml)"
          ./scripts/test-linux-packages.sh \
            --appimage dist/sylvops-linux-x86_64.AppImage \
            --deb dist/sylvops-linux-x86_64.deb \
            --expected-version "$expected_version"

  macos-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            architecture: x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            architecture: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install pinned cargo-packager
        shell: pwsh
        run: |
          $packagerVersion = (Get-Content -Raw packaging/cargo-packager.version).Trim()
          cargo install cargo-packager --version $packagerVersion --locked
      - name: Build ad-hoc signed application package
        run: ./scripts/package-macos.sh --target '${{ matrix.target }}' --architecture '${{ matrix.architecture }}' --signing-identity -
      - name: Install, launch, verify, and remove
        run: |
          expected_version="$(awk '/^\[workspace.package\]/{workspace_package=1; next} workspace_package && /^version = /{gsub(/"/, "", $3); print $3; exit}' Cargo.toml)"
          ./scripts/test-macos-package.sh \
            --dmg 'dist/sylvops-macos-${{ matrix.architecture }}.dmg' \
            --architecture '${{ matrix.architecture }}' \
            --expected-version "$expected_version"
