name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test core library
        run: cargo test -p sylvops-core --lib
      - name: Test daemon configuration
        run: cargo test -p sylvops-daemon --lib config_store::tests
      - name: Test daemon database
        run: cargo test -p sylvops-daemon --lib database::tests
      - name: Test Git repository registration
        run: cargo test -p sylvops-daemon --lib git::tests::registers_unicode_repository_without_an_origin
      - name: Test Git managed worktree lifecycle
        run: cargo test -p sylvops-daemon --lib git::tests::creates_inspects_and_removes_a_managed_worktree
      - name: Test Git dirty removal refusal
        run: cargo test -p sylvops-daemon --lib git::tests::dirty_untracked_and_ignored_files_refuse_removal
      - name: Test Git stale removal token
        run: cargo test -p sylvops-daemon --lib git::tests::stale_clean_state_token_refuses_removal
      - name: Test Git destination preservation
        run: cargo test -p sylvops-daemon --lib git::tests::existing_destination_is_never_overwritten
      - name: Test Git detached HEAD registration
        run: cargo test -p sylvops-daemon --lib git::tests::detached_head_is_registered_without_inventing_a_branch
      - name: Test Git branch validation
        run: cargo test -p sylvops-daemon --lib git::tests::rejects_duplicate_or_unsafe_branches
      - name: Test Git non-repository rejection
        run: cargo test -p sylvops-daemon --lib git::tests::rejects_a_non_repository
      - name: Test Git remote URL sanitization
        run: cargo test -p sylvops-daemon --lib git::tests::remote_urls_are_sanitized_before_persistence
      - name: Test daemon hooks
        run: cargo test -p sylvops-daemon --lib hook::tests
      - name: Test daemon IPC
        run: cargo test -p sylvops-daemon --lib ipc::tests
      - name: Test daemon providers
        run: cargo test -p sylvops-daemon --lib provider::tests
      - name: Test daemon runtime
        run: cargo test -p sylvops-daemon --lib runtime::tests
      - name: Test daemon sessions
        run: cargo test -p sylvops-daemon --lib session::tests
      - name: Test TUI library
        run: cargo test -p sylvops-tui --lib
      - name: Test CLI binary
        run: cargo test -p sylvops-cli --bins
      - name: Test support targets
        run: cargo test -p sylvops-test-support --lib --bins
      - name: Test daemon lifecycle
        run: cargo test -p sylvops-daemon --test daemon_lifecycle
      - name: Test local transport
        run: cargo test -p sylvops-daemon --test local_transport
      - name: Test PTY input and replay
        run: cargo test -p sylvops-test-support --test pty_session session_accepts_input_and_replays_after_detach
      - name: Test PTY process-tree termination
        run: cargo test -p sylvops-test-support --test pty_session stopping_session_terminates_descendant_heartbeat
      - name: Test PTY bounded scrollback
        run: cargo test -p sylvops-test-support --test pty_session large_output_is_bounded_and_reports_eviction
      - name: Test PTY attachment control
        run: cargo test -p sylvops-test-support --test pty_session attachment_lease_rejects_observer_input_and_requires_reattach
      - name: Test persistent sessions
        run: cargo test -p sylvops-daemon --test persistent_sessions
      - name: Test managed worktrees
        run: cargo test -p sylvops-daemon --test worktree_sessions
      - name: Test Codex MVP
        run: cargo test -p sylvops-test-support --test codex_mvp
