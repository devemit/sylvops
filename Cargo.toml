[workspace]
members = [
    "crates/sylvops-core",
    "crates/sylvops-daemon",
    "crates/sylvops-tui",
    "crates/sylvops-desktop",
    "crates/sylvops-cli",
    "crates/sylvops-test-support",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/devemit/sylvops"

[workspace.dependencies]
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
crossbeam-channel = "0.5"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "unstable-locales"] }
ed25519-dalek = "2.2"
futures-util = "0.3"
iced = { version = "0.14", features = ["advanced", "svg", "tokio"] }
ico = "0.5"
rfd = "0.15"
ratatui = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
portable-pty = "0.9"
rmp-serde = "1.3"
rusqlite = "0.40"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
sys-locale = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
url = "2"
vt100 = "0.16"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
